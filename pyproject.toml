[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiogram-fsm-inspector"
version = "0.1.0"
description = "In-Process real-time FSM debugging and inspection suite for aiogram 3.x with FastAPI and WebSockets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "aiogram-devtools contributors" }
]
keywords = ["aiogram", "telegram", "fsm", "devtools", "inspector", "fastapi", "uvicorn", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "aiogram>=3.10.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/dirstd/aiogram-fsm-inspector"
Documentation = "https://github.com/dirstd/aiogram-fsm-inspector#readme"
Repository = "https://github.com/dirstd/aiogram-fsm-inspector"
Issues = "https://github.com/dirstd/aiogram-fsm-inspector/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiogram_fsm_inspector", "src/aiogram_devtools"]
artifacts = ["src/aiogram_fsm_inspector/static/*"]

[tool.hatch.build.targets.wheel.sources]
"src/aiogram_fsm_inspector" = "aiogram_fsm_inspector"
"src/aiogram_devtools" = "aiogram_devtools"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
